name: Deploy to Production

on:
  push:
    branches: [ master ]
    # Trigger только для определённых тегов (например, v1.0.0)
    #tags:
    #  - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to production'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    #name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    name: Deploy to production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')

    environment:
      #name: ${{ github.event.inputs.environment || 'production' }}
      name: production
      url: https://vetvision.uz

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            
            # Перейти в директорию проекта
            cd ${{ secrets.PROJECT_PATH }}
            
            # Подтягиваем последние изменения
            git fetch origin
            git checkout master
            git pull origin master
            
            # Устанавливаем переменные окружения
            # source /etc/elixir4vet/.env.prod
            
            # Устанавливаем зависимости и собираем релиз
            mix deps.get --only prod
            MIX_ENV=prod mix assets.deploy
            MIX_ENV=prod mix phx.digest
            MIX_ENV=prod mix release --path /opt/elixir4vet --overwrite
            
            # Запускаем миграции базы данных
            MIX_ENV=prod mix ecto.migrate
            
            # Останавливаем текущий сервис (если запущен)
            /opt/elixir4vet/bin/elixir4vet stop > /dev/null 2>&1 || true
            
            # Запускаем сервис
            /opt/elixir4vet/bin/elixir4vet daemon

      - name: Health Check
        run: |
          for i in {1..10}; do
            if curl -f https://vetvision.uz/health; then
              echo "✓ Health check passed"
              exit 0
            fi
            echo "Attempt $i/10 failed, retrying in 5 seconds..."
            sleep 5
          done
          echo "✗ Health check failed"
          exit 1

      - name: Notify deployment
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Deployment to ${{ github.event.inputs.environment || 'production' }} ${{ job.status }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
          # webhook_url: ${{ secrets.SLACK_WEBHOOK }}
